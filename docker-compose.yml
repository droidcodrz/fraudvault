version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudvault
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fraudvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudvault"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudvault:password@db:5432/fraudvault
      DATABASE_SYNC_URL: postgresql://fraudvault:password@db:5432/fraudvault
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  worker:
    build: .
    command: celery -A app.workers.detection_worker worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudvault:password@db:5432/fraudvault
      DATABASE_SYNC_URL: postgresql://fraudvault:password@db:5432/fraudvault
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudvault:password@db:5432/fraudvault
      DATABASE_SYNC_URL: postgresql://fraudvault:password@db:5432/fraudvault
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

  seed:
    build: .
    command: python -m scripts.seed
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudvault:password@db:5432/fraudvault
      DATABASE_SYNC_URL: postgresql://fraudvault:password@db:5432/fraudvault
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

volumes:
  pgdata:
